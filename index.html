<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scary Brawl</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gameShell">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="panel">
        <span class="label">Health</span>
        <span id="healthValue">100</span>
      </div>
      <div class="panel">
        <span class="label">Enemy</span>
        <span id="enemyValue">150</span>
      </div>
      <div class="panel">
        <span class="label">Super</span>
        <span id="superValue">0%</span>
      </div>
    </div>

    <div id="mobileControls">
      <div id="moveStick" class="touch-stick">
        <div id="moveStickKnob" class="stick-knob"></div>
      </div>

      <div id="attackWrap">
        <div id="attackStick" class="touch-stick action-stick">
          <div id="attackStickKnob" class="stick-knob"></div>
          <div class="stick-label">AIM</div>
        </div>
        <button id="superTapBtn" class="super-tap" type="button">SUPER</button>
      </div>
    </div>

    <div id="selectScreen" class="overlay visible">
      <div class="card wide">
        <h1>Choose Your Brawler</h1>

        <div id="characterGrid" class="character-grid">
          <button class="character-card selected" type="button" data-character="blaze">
            <div class="avatar blaze"></div>
            <h2>Blaze</h2>
            <p>Fast striker</p>
            <span>Speed can out-smart</span>
          </button>

          <button class="character-card" type="button" data-character="nova">
            <div class="avatar nova"></div>
            <h2>Nova</h2>
            <p>Balanced shooter</p>
            <span>Accuracy is better</span>
          </button>

          <button class="character-card" type="button" data-character="titan">
            <div class="avatar titan"></div>
            <h2>Titan</h2>
            <p>Heavy bruiser</p>
            <span>Slow and steady</span>
          </button>
        </div>

        <button id="startBtn" class="primary-btn" type="button">Start Match</button>
      </div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="card">
        <h1>Battle Over</h1>
        <p id="finalStats">You won the arena.</p>
        <button id="restartBtn" type="button">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
