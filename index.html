<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scary Brawl</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <div id="menu" class="panel visible">
        <div class="menu-card">
          <p class="eyebrow">BRAWL MODE</p>
          <h1>Scary Brawl</h1>

          <div class="character-grid" id="characterGrid"></div>

          <div class="menu-actions">
            <button id="startBtn" class="primary-btn">Start Match</button>
          </div>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div class="topbar">
          <div class="stat-box">
            <span class="label">HP</span>
            <div class="health-bar">
              <div id="healthFill"></div>
            </div>
          </div>
          <div class="stat-box center">
            <span id="score">0</span>
          </div>
          <div class="stat-box right">
            <span class="label">WAVE</span>
            <strong id="wave">1</strong>
          </div>
        </div>
      </div>

      <div id="gameOver" class="panel hidden">
        <div class="menu-card small">
          <p class="eyebrow">MATCH OVER</p>
          <h2 id="finalScore">Score: 0</h2>
          <button id="restartBtn" class="primary-btn">Play Again</button>
        </div>
      </div>

      <div id="joystick" class="joystick hidden">
        <div class="stick-base">
          <div id="stickThumb" class="stick-thumb"></div>
        </div>
      </div>

      <button id="fireBtn" class="fire-btn hidden">FIRE</button>
    </div>

    <script src="game.js"></script>
  </body>
</html>
